{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APAE Biscoitos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'style/style.css' %}">
    <style>
        /* ── NAVBAR RESPONSIVA ── */
        .navbar-brand {
            font-weight: 800;
            font-size: 1.6rem;
        }

        @media (max-width: 600px) {
            .navbar-brand {
                font-size: 0.95rem;
                white-space: normal;
                text-align: center;
                line-height: 1.3;
            }
            .navbar {
                padding-top: 8px;
                padding-bottom: 8px;
            }
        }

        /* ── CABEÇALHO (VOLTAR + TÍTULO) ── */
        /* Padrão: funciona no desktop com position absolute */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 60px;
            margin-bottom: 1rem;
        }

        .page-header .btn-voltar {
            position: absolute;
            left: 0;
            box-shadow: 6px 6px 0px #000;
            border: 3px solid #000;
            border-radius: 12px;
        }

        .page-header .btn-voltar a {
            background-color: #ffcc00;
            display: block;
            font-weight: 800;
            padding: 12px 20px;
            border-radius: 10px;
            text-decoration: none;
            color: #000;
        }

        /* No celular: empilha botão e título verticalmente */
        @media (max-width: 600px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                min-height: unset;
                gap: 12px;
                margin-bottom: 0.5rem;
            }

            .page-header .btn-voltar {
                position: static;
                box-shadow: 4px 4px 0px #000;
            }

            .page-header .page-title {
                align-self: center;
                font-size: 0.9rem !important;
                padding: 8px 14px !important;
                max-width: 100% !important;
                white-space: normal !important;
                text-align: center !important;
                margin: 0 !important;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container justify-content-center">
            <a class="navbar-brand" href="{% url 'home' %}">🍪 APAE - GESTÃO DE BISCOITOS</a>
        </div>
    </nav>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
